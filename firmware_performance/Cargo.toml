[package]
name = "little_squeaky_machine_performance"
version = "0.1.0"
edition = "2024"


[dependencies]

esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "println", "esp32s3"] }
embassy-executor = { version = "0.10.0", features = [] }
embassy-time     = "0.5.1"
embassy-sync = "0.8.0"
esp-alloc        = "0.10.0"

critical-section = "1.2.0"
static_cell      = "2.1.1"

esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }

#log = { version = "0.4.28" }
little_weirdo = { path = "../../little-weirdo" }
little_weirdo_filesystem = { path = "../../little-weirdo-filesystem" }
postcard = "1.1.3"
embassy-embedded-hal = "0.6.0"
serde = { version = "1.0.228", default-features = false, features = ["alloc"] }
esp-storage ={ version="0.9.0", features = ["esp32s3"]}
embedded-storage = { version= "0.3.1", features = []}