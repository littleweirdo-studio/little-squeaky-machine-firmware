[package]
name = "experiment"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04", "esp-radio"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "println", "esp32s3"] }
embassy-executor = { version = "0.10.0", features = [] }
embassy-time     = "0.5.1"
embassy-sync = "0.8.0"
esp-alloc        = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
static_cell = "2.1.0"
embassy-usb = "0.6.0"