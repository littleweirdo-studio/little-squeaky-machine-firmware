[package]
name = "little_squeaky_machine"
version = "0.1.0"
edition = "2024"

[dependencies]

esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable", "psram"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.18.1", features = ["panic-handler", "println", "esp32s3"] }
embassy-executor = { version = "0.9.0", features = [] }
embassy-time     = "0.5.0"
embassy-sync = "0.7.2"
esp-alloc        = "0.9.0"

critical-section = "1.2.0"
static_cell      = "2.1.1"

esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }

#log = { version = "0.4.28" }
little_weirdo = { path = "../../little-weirdo" }
little_weirdo_filesystem = { path = "../../little-weirdo-filesystem" }
little_weirdo_gui = { path = "../../little_weirdo_gui" }

usb-device = "0.3.2"
usbd-midi = { version = "0.5.1" }
embedded-graphics = { version = "0.8.2" }
ssd1306 = { version = "0.10.0", features=["async"] }
embassy-futures = "0.1.2"
embassy-usb = "0.5.1"
tinybmp = "0.7.0"
esp-storage ={ version="0.8.1", features = ["esp32s3"]}
embedded-storage = { version= "0.3.1", features = []}
esp-partition-table = "0.1.2"
driver_sgtl5000 = { path = "../../driver-sgtl5000"}
driver_cy8cmbr3108 = { path = "../../driver-cy8cmbr3108"}
driver_stk8321 = { path = "../../driver-stk8321"}
esp-hal-smartled = {git = "https://github.com/esp-rs/esp-hal-community.git", rev = "728f276", features = ["esp32s3"] }
smart-leds = "0.4.0"
sequential-storage = "7.1.0"
midi-msg = { version = "0.8.0", default-features = false, features=["sysex"] }
postcard = "1.1.3"
embassy-embedded-hal = "0.5.0"
embedded-graphics-unicodefonts = "0.2.0"
embedded-icon = { version = "0.0.1", features=["12px"] }
embedded-picofont = "0.2.1"
keypad = "0.2.2"
embedded-hal-bus = "0.3.0"
serde = { version = "1.0.228", default-features = false, features = ["alloc"] }



[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
