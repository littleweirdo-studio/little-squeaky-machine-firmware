[target.xtensa-esp32-none-elf]
runner = "espflash flash --partition-table=partitions.csv --monitor"

[env]
ESP_LOGLEVEL="INFO"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Wl,-Tlinkall.x",
  "-C", "link-arg=-Trom_functions.x",
]
target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["core"]
