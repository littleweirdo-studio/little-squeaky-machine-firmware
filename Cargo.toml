[package]
name = "little_squeaky-machine"
version = "0.1.0"
authors = ["Daniël van Gils"]
edition = "2024"
rust-version = "1.88"
license = ""


[dependencies]

esp-hal = { version = "=1.0.0-rc.1", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.1.1", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.3.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.18.0", features = ["panic-handler", "println", "esp32s3"] }
embassy-executor = { version = "0.9.0", features = [] }
embassy-time     = "0.5.0"
embassy-sync = "0.7.2"
esp-alloc        = "0.9.0"

critical-section = "1.2.0"
static_cell      = "2.1.1"

esp-println = { version = "0.16.0", features = ["esp32s3", "log-04"] }

#log = { version = "0.4.28" }
little_weirdo = { path = "../little-weirdo" }

usb-device = "0.3.2"
usbd-midi = { version = "0.5.0" }
embedded-graphics = { version = "0.8.1" }
ssd1306 = { git = "https://github.com/rust-embedded-community/ssd1306.git", rev = "f3a2f7aca421fbf3ddda45ecef0dfd1f0f12330e",  features=["async"] }
embassy-futures = "0.1.2"
embassy-usb = "0.5.1"
tinybmp = "0.6.0"
esp-storage ={ version="0.6.0", features = ["esp32s3"]}
embedded-storage = { version= "0.3.1", features = []}
esp-partition-table = "0.1.2"
driver_sgtl5000 = { path = "../driver-sgtl5000"}
esp-hal-smartled = {git = "https://github.com/esp-rs/esp-hal-community.git", rev = "728f276", features = ["esp32s3"] }
smart-leds = "0.4.0"
sequential-storage = "5.0.1"
midi-msg = { version = "0.8.0", default-features = false, features=["sysex"] }
postcard = "1.1.3"




[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
