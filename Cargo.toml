[package]
name = "little_squeaky-machine"
version = "0.1.0"
authors = ["Daniël van Gils <daniel.van.gils@politie.nl>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]

esp-backtrace = { version = "0.14.2", features = [
    "esp32",
    "exception-handler",
    "panic-handler",
    "println",
]}

esp-hal = { version = "0.22.0", features = [
    "esp32"
]}

esp-hal-embassy = { version = "0.5.0", features= [
    "esp32"
]}

embedded-hal = { version = "1.0.0" }

embassy-executor    = { version = "0.6.0", features = [
    "task-arena-size-24576",
    "integrated-timers",
]}

embassy-time = { version = "0.3.2" }

embassy-sync = { version = "0.6.1", features = [

]}

esp-println = { version = "0.12.0", features = [
    "esp32", 
    "log"
] }

log = { version = "0.4.22" }
esp-alloc = { version = "0.5.0" }
little_weirdo = { path = "../little-weirdo" }
static_cell         = { version = "2.1.0", features = ["nightly"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
