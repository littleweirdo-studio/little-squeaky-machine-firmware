[package]
name = "little_squeaky-machine"
version = "0.1.0"
authors = ["Daniël van Gils"]
edition = "2021"
license = ""


[dependencies]

esp-backtrace = { version = "0.14.2", features = [
    "esp32s3",
    "exception-handler",
    "panic-handler",
    "println",
] }

esp-hal = { version = "0.22.0", features = ["esp32s3", "octal-psram"] }

esp-hal-embassy = { version = "0.5.0", features = ["esp32s3"] }

embedded-hal = { version = "1.0.0" }

embassy-executor = { version = "0.6.0", features = [
    "nightly",
    "integrated-timers",
] }

embassy-time = { version = "0.3.2" }

embassy-sync = { version = "0.6.1", features = [] }

esp-println = { version = "0.12.0", features = ["esp32s3", "log"] }

log = { version = "0.4.22" }
esp-alloc = { version = "0.5.0" }
little_weirdo = { path = "../little-weirdo" }
#little-weirdo-soundbanks = { path = "../little-weirdo-soundbanks" }

static_cell = { version = "2.1.0", features = ["nightly"] }
usb-device = "0.3.2"
usbd-midi = { version = "0.3.0" }
embedded-graphics = { version = "0.8.1" }
ssd1306 = { git = "https://github.com/rust-embedded-community/ssd1306.git", rev = "f3a2f7aca421fbf3ddda45ecef0dfd1f0f12330e",  features=["async"] }
fugit = "0.3.7"
embassy-futures = "0.1.1"
embassy-usb = "0.3.0"
tinybmp = "0.6.0"
esp-storage ={ version="0.4.0", features = ["esp32s3"]}
embedded-storage = "0.3.1"
esp-partition-table = "0.1.2"
driver-sgtl5000 = { path = "../driver-sgtl5000"}

[profile.dev]
opt-level = "s"


[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

